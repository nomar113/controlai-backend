spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/controlai?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    time-zone: UTC

  # One thread per @Scheduled job (the two SQS pollers and the account purge), so a long purge
  # never pauses the queues
  task:
    scheduling:
      pool:
        size: 3

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false
    baseline-on-migrate: true

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.jdbc: DEBUG

aws:
  region: ${AWS_REGION:us-east-1}
  access-key-id: ${AWS_ACCESS_KEY_ID:test}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:test}
  sqs:
    endpoint: ${AWS_SQS_ENDPOINT:http://localhost:4566}
    account-id: ${AWS_ACCOUNT_ID:000000000000}
    payments-notifications-queue-url: ${aws.sqs.endpoint}/${aws.sqs.account-id}/payments-notifications
    purchases-invoices-queue-url: ${aws.sqs.endpoint}/${aws.sqs.account-id}/purchases-invoices

account-deletion:
  # Daily purge of the accounts whose 30-day grace period is over, in Brasília time
  # (AccountPurgeScheduler). "-" as the cron keeps the bean but never runs it.
  purge-cron: ${ACCOUNT_DELETION_PURGE_CRON:0 0 4 * * *}
  purge-enabled: ${ACCOUNT_DELETION_PURGE_ENABLED:true}

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:*}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
