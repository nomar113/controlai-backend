spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/controlai}
    username: ${DB_USERNAME:user}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false
    baseline-on-migrate: true

logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.jdbc: DEBUG

aws:
  region: ${AWS_REGION:us-east-1}
  access-key-id: ${AWS_ACCESS_KEY_ID:test}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:test}
  sqs:
    endpoint: ${AWS_SQS_ENDPOINT:http://localhost:4566}
    account-id: ${AWS_ACCOUNT_ID:000000000000}
    payments-notifications-queue-url: ${aws.sqs.endpoint}/${aws.sqs.account-id}/payments-notifications
    purchases-invoices-queue-url: ${aws.sqs.endpoint}/${aws.sqs.account-id}/purchases-invoices

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:*}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
