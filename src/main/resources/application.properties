spring.application.name=controlai
management.endpoints.web.exposure.include=health

# Symmetric key for HS256 JWT signing; must be at least 256 bits (32 bytes)
jwt.secret=${JWT_SECRET:}

# Comma-separated Google OAuth Client IDs (web + iOS) used to verify ID tokens
google.client-ids=${GOOGLE_CLIENT_IDS:placeholder-not-configured}

# Comma-separated Apple Sign In audiences: bundle ID (iOS/Android native) and Services ID (web)
apple.client-ids=${APPLE_CLIENT_IDS:placeholder-not-configured}
# Sign in with Apple credentials for the code exchange (client_secret is an ES256 JWT built from the .p8 key)
apple.team-id=${APPLE_TEAM_ID:}
apple.key-id=${APPLE_KEY_ID:}
apple.private-key=${APPLE_PRIVATE_KEY:}
# AES-256 key, base64 (32 bytes), used to encrypt the Apple refresh token at rest. Required at startup.
apple.token-encryption-key=${APPLE_TOKEN_ENCRYPTION_KEY}

# Resend email service (https://resend.com)
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:noreply@controlai.app}

# Web app public URL used in email links (e.g. password reset)
app.web-url=${APP_WEB_URL:http://localhost:3000}

# Deep link the Android app listens on for the Apple login handoff code (must match the app's intent filter)
apple.return-uri.android=${APPLE_RETURN_URI_ANDROID:controlai://auth/apple-login}

# One-off installment/statement backfill (InstallmentReconciliationRunner). Off by default so it
# never runs on a normal boot; set to true for a single controlled deploy, then back to false/unset.
app.reconciliation.installments.run-full-backfill=${RUN_FULL_INSTALLMENT_BACKFILL:false}

# Kiwify webhook (billing) — shared secret token configured in the Kiwify panel, and the
# product/offer ids that distinguish the annual subscription from the lifetime upgrade.
kiwify.webhook-token=${KIWIFY_WEBHOOK_TOKEN:}
kiwify.product.annual-id=${KIWIFY_PRODUCT_ANNUAL_ID:}
kiwify.product.lifetime-id=${KIWIFY_PRODUCT_LIFETIME_ID:}
