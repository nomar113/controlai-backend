spring.application.name=controlai
management.endpoints.web.exposure.include=health

# Symmetric key for HS256 JWT signing; must be at least 256 bits (32 bytes)
jwt.secret=${JWT_SECRET:}

# Comma-separated Google OAuth Client IDs (web + iOS) used to verify ID tokens
google.client-ids=${GOOGLE_CLIENT_IDS:placeholder-not-configured}

# Resend email service (https://resend.com)
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:noreply@controlai.app}

# Web app public URL used in email links (e.g. password reset)
app.web-url=${APP_WEB_URL:http://localhost:3000}
