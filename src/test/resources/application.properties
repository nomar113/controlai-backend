spring.application.name=controlai-test

# JPA — dialect auto-detected from the (Testcontainers) MySQL datasource
spring.jpa.hibernate.ddl-auto=none

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT secret for tests (>= 32 bytes for HS256)
jwt.secret=controlai-test-secret-0123456789abcdef0123456789abcdef

# Dummy value for tests; the verifier is always mocked in Google login integration tests
google.client-ids=test-web-client-id,test-ios-client-id

# Apple: verifier and code exchange are mocked in integration tests; the key is a 32-byte test value
apple.client-ids=test-apple-bundle-id,test-apple-services-id
apple.team-id=TESTTEAM00
apple.key-id=TESTKEY000
apple.private-key=
apple.token-encryption-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

# Resend — value unused in tests (EmailGateway is mocked in integration tests)
resend.api-key=test-not-used
resend.from-email=noreply@test.controlai.app
app.web-url=http://localhost:3000

# Disable SQS for tests
aws.region=us-east-1
aws.access-key-id=test
aws.secret-access-key=test
aws.sqs.endpoint=http://localhost:4566
aws.sqs.account-id=000000000000

# Kiwify webhook (billing)
kiwify.webhook-token=test-kiwify-webhook-token
kiwify.product.annual-id=test-annual-product-id
kiwify.product.lifetime-id=test-lifetime-product-id

# Datasource: the disposable Testcontainers MySQL is set by TestcontainersDatasourcePostProcessor
# (registered in META-INF/spring.factories), because ./application.yml outranks this file.
