spring.application.name=controlai-test

# H2 in MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:controlai_test;MODE=MYSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Disable SQS for tests
aws.region=us-east-1
aws.access-key-id=test
aws.secret-access-key=test
aws.sqs.endpoint=http://localhost:4566
aws.sqs.account-id=000000000000
